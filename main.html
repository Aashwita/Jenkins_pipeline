<!DOCTYPE html>
<html>
<head>
 <title>CodeSynthesis</title>
<style>
    .form1{
          max-width: 600px;
          width: 100%;

          margin: 40px auto;

          padding: 30px;

          background-color: #004c99;
          
          color:lightblue;

          font-family:"Times New Roman";

    }
    label{
        font-weight: bold;
        font-size : 18px;
    }
    h1{
        color:#ffd800;
    }
    h4{
        color:darkgray;
    }
    .form1 input[type="submit"] ,.form1 input[type="reset"]{
        background-color: lightblue; 
        padding : 5px 16px
     }
</style>
</head>
<body bgcolor="#001933" ><center>
    <div class="font">
        <h1>CodeSynthesis</h1>
        <h4>Register for CodeSynthesis here!</h4>
    </div></center>

<div class="form1">
    <form>
    <label>Name: </label><br>
    <input type="text" id = "name" name="name">
    <br><br>

    <label>Gender: </label><br>
    <input type = "radio" name="gender" value="female">Female
    <input type = "radio" name="gender" value="male">Male
    <br><br>

    <label>Email Address:</label><br>
    <input type="email" name = "email">
    <br><br>

    <label>Phone Number:</label><br>
    <input type = "text" name="phno">
    <br><br>

    <label>College Name: </label><br>
    <input type = "text" name="cname">
    <br><br>

    <label> Branch: </label><br>
    <select name = "branch">
        <option value = "cse">CSE</option>
        <option value="ece">ECE</option>
        <option value="it">IT</option>
        <option value = "eee">EEE</option>
        <option value="csm">CSM</option>
    </select>
    <br><br>

    <label>College Roll No: </label><br>
    <input type="text" name="rollNo">
    <br><br>

    <label>Year of Passing: </label><br>
    <select name = "year">
        <option value = "Graduated">Graduated</option>
        <option value = "2027">2027</option>
        <option value = "2028">2028</option>
        <option value = "2029">2029</option>
    </select>
    <br><br>

    <label>Programming Lannguages Known:</label><br>
    <input type="checkbox" name = "python" value="on">Python
    <input type="checkbox" name = "go" value="on">Go
    <input type="checkbox" name = "javascript" value="on">JavaScript
    <input type="checkbox" name = "typescript" value="on">TypeScript
    <input type="checkbox" name = "java" value="on">Java
    <input type="checkbox" name = "cpp" value="on">C++
    <br><br>

    <label>GitHub Profile URL: </label><br>
    <input type="url" name="github">
    <br><br>

    <label>Linkedin Profile URL: </label><br>
    <input type="url" name="linkedin">
    <br><br>

    <label>Attach Passport Size Image: </label><br>
    <input type = "file" name="image">
    <br><br>

    <input type="submit" name="submit">&nbsp&nbsp
    <input type="reset" name="reset">

    </form>
</div>
</body>
</html>
